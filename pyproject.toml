[project]
name = "agentbench"
version = "0.1.0"
description = "Decision-delegated agent controllers on Terminal-Bench"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Naman Vats", email = "be10360.17@bitmesra.ac.in" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.6",
    "harbor[daytona]==0.24.0",
    "httpx>=0.28.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "openai>=2.54.0",
    "pandas>=3.0.6",
    "pydantic>=2.14.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
    "typer>=0.27.3",
]

[project.scripts]
agentbench = "agentbench.cli:app"

[build-system]
requires = ["uv_build>=0.9.30,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-m \"not integration\""
markers = ["integration: needs real API keys (skipped otherwise)"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]
