# Frozen experiment caps: p90 of passing native calibration runs (`agentbench limits`).
# Set above every calibration run (passing max: 52 steps / $0.48; failing max: $0.98) so caps
# never decide outcomes; G2 abandon becomes possible from step 24 (0.4 × 60). See decision log.
